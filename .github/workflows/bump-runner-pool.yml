name: Bump runner-pool

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to the latest stable release)
        required: false
        type: string
  repository_dispatch:
    types: [runner-pool-release]

permissions:
  contents: write

concurrency:
  group: bump-runner-pool
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true

      - name: Resolve release and compare versions
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-${DISPATCH_TAG:-}}
          args=()
          endpoint=latest
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "tag must look like vX.Y.Z" >&2; exit 1;
            }
            args=("$tag")
            endpoint="tags/$tag"
          fi
          if ! release=$(gh release view "${args[@]}" -R 0x63616c/runner-pool --json tagName,isDraft,isPrerelease); then
            release=$(curl --fail --location --silent --show-error \
              "https://api.github.com/repos/0x63616c/runner-pool/releases/$endpoint")
          fi
          tag=$(printf '%s' "$release" | python3 -c '
          import json, sys
          release = json.load(sys.stdin)
          if release.get("isDraft", release.get("draft", True)) or release.get("isPrerelease", release.get("prerelease", True)):
              sys.exit("release must not be a draft or prerelease")
          print(release.get("tagName", release.get("tag_name", "")))
          ')
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must look like vX.Y.Z" >&2; exit 1;
          }
          version=${tag#v}
          current=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/runner-pool.rb)
          [[ "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid formula version: $current" >&2; exit 1;
          }
          if [[ "$version" == "$current" || $(printf '%s\n' "$version" "$current" | sort -V | tail -n 1) != "$version" ]]; then
            echo "already current: formula $current, release $tag"
            exit 0
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "newer=true"
          } >> "$GITHUB_OUTPUT"

      - name: Bump and verify the release tarball
        if: steps.release.outputs.newer == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          script/bump-runner-pool "$TAG"
          ruby -c Formula/runner-pool.rb
          asset=runner-pool-aarch64-apple-darwin.tar.gz
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          gh release download "$TAG" -R 0x63616c/runner-pool -p "$asset" -D "$dir"
          sha=$(sed -n 's/^  sha256 "\([0-9a-f]*\)"$/\1/p' Formula/runner-pool.rb)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid formula sha256" >&2; exit 1; }
          printf '%s  %s\n' "$sha" "$dir/$asset" | sha256sum --check --strict

      - name: Commit and push to main
        if: steps.release.outputs.newer == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git add Formula/runner-pool.rb
          git -c user.name=Calum -c user.email=6991398+0x63616c@users.noreply.github.com \
            commit -m "runner-pool $VERSION"
          git push origin HEAD:main
